<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --orange:#e8590c; --bg:#111; --card:#1c1c1c; --text:#eee; --muted:#999; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 14px 6px; }
  h1 { margin:0; font-size:1.3rem; }
  h1 span { color:var(--orange); }
  .sub { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; padding:8px 14px; }
  .controls input { flex:1 1 180px; padding:10px; border-radius:8px; border:1px solid #333; background:#222; color:var(--text); font-size:1rem; }
  button, select { padding:10px 12px; border-radius:8px; border:none; font-size:.95rem; cursor:pointer; }
  button { background:var(--orange); color:#fff; font-weight:600; }
  button.ghost { background:#2a2a2a; color:var(--text); }
  select { background:#2a2a2a; color:var(--text); }
  #status { padding:4px 14px 8px; color:var(--muted); font-size:.9rem; min-height:1.4em; }
  #map { height:45vh; margin:0 14px; border-radius:10px; }
  #list { list-style:none; margin:10px 14px 30px; padding:0; }
  #list li { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  #list li.best { outline:2px solid var(--orange); }
  #list li.active { background:#2a2018; }
  .rank { font-weight:700; color:var(--orange); min-width:1.6em; }
  .info { flex:1; }
  .name { font-weight:600; }
  .meta { color:var(--muted); font-size:.82rem; margin-top:2px; }
  .dist { font-weight:700; white-space:nowrap; text-align:right; }
  .dist small { display:block; font-weight:400; color:var(--muted); font-size:.75rem; }
  .net { display:inline-block; font-size:.75rem; padding:2px 7px; border-radius:999px; margin-top:5px; }
  .net.yes { background:#1f3d26; color:#8ce99a; }
  .net.no { background:#3d1f1f; color:#ffa8a8; }
  .net.unknown { background:#2a2a2a; color:var(--muted); }
  .links { margin-top:5px; }
  .links a { color:var(--orange); font-size:.85rem; margin-right:12px; text-decoration:none; }
  .links a:hover { text-decoration:underline; }
  #list li:hover { background:#252525; }
  #list:empty::before { content:'Pick a location to see courts here.'; color:var(--muted); font-size:.9rem; }

  /* Desktop: big map on the left, scrollable results list on the right */
  @media (min-width: 900px) {
    body { height:100vh; display:grid; overflow:hidden;
      grid-template-columns: 1fr 380px;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas: "head head" "ctrl ctrl" "stat stat" "map list"; }
    header { grid-area:head; padding:16px 20px 4px; }
    h1 { font-size:1.6rem; }
    .controls { grid-area:ctrl; padding:8px 20px; }
    .controls input { flex:0 1 420px; }
    #status { grid-area:stat; padding:4px 20px 10px; }
    #map { grid-area:map; height:auto; margin:0 0 20px 20px; }
    #list { grid-area:list; margin:0 20px 20px 14px; overflow-y:auto; }
  }
</style>
</head>
<body>
<header>
  <h1>🏀 Court <span>Finder</span></h1>
  <div class="sub">Nearest basketball courts by bike, from OpenStreetMap. Tap a court to see the route. Tap the map to set your spot.</div>
</header>

<div class="controls">
  <button id="gps">📍 Use my location</button>
  <input id="addr" placeholder="…or type an address / place">
  <button id="search" class="ghost">Search</button>
  <select id="radius" title="Search radius">
    <option value="1000">1 km</option>
    <option value="3000" selected>3 km</option>
    <option value="5000">5 km</option>
    <option value="10000">10 km</option>
  </select>
</div>
<div id="status"></div>
<div id="map"></div>
<ol id="list"></ol>

<script>
// ---------- 1. Map setup: normal map + satellite toggle ----------
const map = L.map('map').setView([52.06, 4.49], 13); // start view: roughly Zoetermeer
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors · Routing: FOSSGIS / OSRM'
}).addTo(map);
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Imagery &copy; Esri'
});
L.control.layers({ 'Map': streets, 'Satellite': satellite }).addTo(map);

const courtLayer = L.layerGroup().addTo(map);
let routeLine = null, homeMarker = null, home = null;

const $ = id => document.getElementById(id);
const setStatus = msg => $('status').textContent = msg;

// ---------- 2. Helpers ----------
// fetch() with a time limit, so a dead server can't freeze the page forever
// `outer` = the current search's signal: starting a new search cancels the old one's requests
async function fetchWithTimeout(url, opts = {}, ms = 8000, outer = null) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  if (outer) { if (outer.aborted) ctrl.abort(); else outer.addEventListener('abort', () => ctrl.abort(), { once: true }); }
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(timer); }
}

// Haversine: straight-line distance on a sphere. Now only used to pre-filter
// and as a fallback when the bike router is down.
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = d => d * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const fmt = m => m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(1) + ' km';
const mins = s => Math.max(1, Math.round(s / 60)) + ' min';

// ---------- 3. Courts from Overpass ----------
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];
// Ask ALL mirrors at the same time; the first good answer wins and the rest get cancelled.
// (Before, it tried them one after another, so 3 slow servers = 24 s of waiting.)
async function fetchCourts(lat, lon, radius, signal) {
  const q = `[out:json][timeout:10];
    nwr["leisure"="pitch"]["sport"~"basketball"](around:${radius},${lat},${lon});
    out center tags;`;
  const race = new AbortController();
  signal.addEventListener('abort', () => race.abort(), { once: true });
  const attempts = OVERPASS.map(async url => {
    const res = await fetchWithTimeout(url, { method:'POST', body:'data=' + encodeURIComponent(q),
      headers:{ 'Content-Type':'application/x-www-form-urlencoded' } }, 9000, race.signal);
    if (!res.ok) throw new Error(res.status === 429 ? 'too many requests, wait a bit' : 'HTTP ' + res.status);
    const json = await res.json();
    if (json.remark && !json.elements.length) throw new Error(json.remark); // Overpass reports its own timeouts here
    return json.elements;
  });
  try { return await Promise.any(attempts); }
  catch (agg) { const e = agg.errors?.[0]; throw e?.name === 'AbortError' ? new Error('all servers too slow') : (e || agg); }
  finally { race.abort(); } // cancel the losers so they stop using server slots
}

function toCourts(elements, lat, lon) {
  return elements.map(el => {
    const cLat = el.lat ?? el.center?.lat, cLon = el.lon ?? el.center?.lon;
    if (cLat == null) return null;
    return { lat: cLat, lon: cLon, tags: el.tags || {},
      osm: `https://www.openstreetmap.org/${el.type}/${el.id}`,
      air: haversine(lat, lon, cLat, cLon), bike: null, bikeTime: null };
  }).filter(Boolean).sort((a, b) => a.air - b.air);
}

// ---------- 4. Bike distances: OSRM "table" service, ONE request for all courts ----------
// FOSSGIS runs a bike-profile OSRM server. Its URL says "driving" but the
// server under /routed-bike/ is built with the bike profile.
// Coordinates go in as lon,lat (OSRM order!), first one = you (sources=0).
const BIKE = 'https://routing.openstreetmap.de/routed-bike';
const MAX_ROUTED = 25; // be polite to a free server: only route the 25 nearest
async function addBikeDistances(courts, signal) {
  const subset = courts.slice(0, MAX_ROUTED);
  const coords = [[home.lon, home.lat], ...subset.map(c => [c.lon, c.lat])]
    .map(p => p[0].toFixed(6) + ',' + p[1].toFixed(6)).join(';');
  const res = await fetchWithTimeout(`${BIKE}/table/v1/driving/${coords}?sources=0&annotations=distance,duration`, {}, 6000, signal);
  const data = await res.json();
  if (data.code !== 'Ok') throw new Error(data.message || data.code);
  subset.forEach((c, i) => {           // index 0 in the row is you → courts start at 1
    c.bike = data.distances[0][i + 1];
    c.bikeTime = data.durations[0][i + 1];
  });
  // Sort by bike distance; anything the router couldn't reach goes to the end
  return courts.sort((a, b) => (a.bike ?? Infinity) - (b.bike ?? Infinity) || a.air - b.air);
}

// Draw the actual bike route to one court (OSRM "route" service)
async function showRoute(c) {
  try {
    const res = await fetchWithTimeout(`${BIKE}/route/v1/driving/${home.lon},${home.lat};${c.lon},${c.lat}?overview=full&geometries=geojson`, {}, 10000);
    const data = await res.json();
    if (data.code !== 'Ok') throw new Error(data.code);
    if (routeLine) routeLine.remove();
    routeLine = L.geoJSON(data.routes[0].geometry, { style: { color:'#4dabf7', weight:5, opacity:.85 }, interactive: false }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding:[30, 30] });
  } catch { map.setView([c.lat, c.lon], 17); } // router down → just zoom to the court
}

// ---------- 5. Net or no net (OSM tag hoops:nets = chord | chain | none) ----------
function netBadge(t) {
  const n = t['hoops:nets'];
  if (n === 'chord') return '<span class="net yes">🕸️ Net (rope)</span>';
  if (n === 'chain') return '<span class="net yes">⛓️ Net (chain)</span>';
  if (n === 'none' || n === 'no') return '<span class="net no">❌ No net</span>';
  return '<span class="net unknown">❔ Net unknown, check Street View</span>';
}

function describe(t) {
  const bits = [];
  if (t.surface) bits.push(t.surface.replace(/_/g, ' '));
  if (t.hoops) bits.push(t.hoops + ' hoop' + (t.hoops === '1' ? '' : 's'));
  if (t['hoops:height'] === 'mini') bits.push('low hoops');
  if (t.lit === 'yes') bits.push('lit at night');
  if (t.indoor === 'yes' || t.covered === 'yes') bits.push('indoor/covered');
  if (t.access && t.access !== 'yes') bits.push('access: ' + t.access);
  if (/;/.test(t.sport)) bits.push('shared: ' + t.sport.replace(/;/g, ', '));
  return bits.join(' · ') || 'no extra details mapped';
}

// ---------- 6. Show results ----------
function render(courts) {
  courtLayer.clearLayers();
  if (routeLine) { routeLine.remove(); routeLine = null; }
  const list = $('list'); list.innerHTML = '';
  courts.forEach((c, i) => {
    const title = c.tags.name || 'Basketball court';
    const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${home.lat},${home.lon}&destination=${c.lat},${c.lon}&travelmode=bicycling`;
    const street = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${c.lat},${c.lon}`;
    const distHtml = c.bike != null
      ? `🚲 ${fmt(c.bike)}<small>${mins(c.bikeTime)} by bike</small>`
      : `${fmt(c.air)}<small>straight line</small>`;

    const m = L.circleMarker([c.lat, c.lon], {
      radius: i === 0 ? 10 : 7, color:'#e8590c', fillColor: i === 0 ? '#e8590c' : '#ffa94d', fillOpacity:.9, weight:2,
      bubblingMouseEvents: false // clicking a court must not also count as clicking the map (= new home spot)
    }).addTo(courtLayer).bindPopup(`<b>${i+1}. ${title}</b><br>${distHtml.replace(/<\/?small>/g, ' ')}<br>${netBadge(c.tags)}`);

    const li = document.createElement('li');
    if (i === 0) li.className = 'best';
    li.innerHTML = `<div class="rank">${i+1}</div>
      <div class="info"><div class="name">${title}</div>
        <div class="meta">${describe(c.tags)}</div>
        ${netBadge(c.tags)}
        <div class="links"><a href="${gmaps}" target="_blank">🚲 Google Maps</a><a href="${street}" target="_blank">👀 Street View</a><a href="${c.osm}" target="_blank">OSM</a></div>
      </div><div class="dist">${distHtml}</div>`;
    li.addEventListener('click', e => {
      if (e.target.tagName === 'A') return;
      document.querySelectorAll('#list li.active').forEach(x => x.classList.remove('active'));
      li.classList.add('active');
      m.openPopup();
      showRoute(c);
      if (window.innerWidth < 900) window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    m.on('click', () => { li.click(); li.scrollIntoView({ block:'nearest', behavior:'smooth' }); });
    list.appendChild(li);
  });
  if (courts.length) {
    const b = L.latLngBounds([[home.lat, home.lon], ...courts.slice(0, 5).map(c => [c.lat, c.lon])]);
    map.fitBounds(b, { padding:[30, 30] });
  }
}

// ---------- 7. Main flow ----------
let searchId = 0, currentSearch = null, ticker = null;
function startTicker(msg) {              // live "… 3 s" counter so you can see it's alive
  clearInterval(ticker);
  const t0 = Date.now();
  setStatus(msg);
  ticker = setInterval(() => setStatus(`${msg} ${Math.round((Date.now() - t0) / 1000)} s`), 1000);
}
const stopTicker = () => clearInterval(ticker);

async function searchFrom(lat, lon, label) {
  const id = ++searchId;
  if (currentSearch) currentSearch.abort(); // cancel the previous search's requests
  currentSearch = new AbortController();
  const signal = currentSearch.signal;
  home = { lat, lon };
  try { localStorage.setItem('courtHome', JSON.stringify(home)); } catch {}
  if (homeMarker) homeMarker.remove();
  homeMarker = L.marker([lat, lon]).addTo(map).bindPopup(label || 'You');
  const radius = +$('radius').value;
  startTicker(`Searching courts within ${fmt(radius)}…`);
  let courts;
  try {
    courts = toCourts(await fetchCourts(lat, lon, radius, signal), lat, lon);
  } catch (e) {
    if (id === searchId) stopTicker(), setStatus('Could not reach the OpenStreetMap servers (' + e.message + '). Try again in a minute.');
    return;
  }
  if (id !== searchId) return;
  if (!courts.length) { stopTicker(); render([]); return setStatus(`No courts mapped within ${fmt(radius)}. Try a bigger radius.`); }

  startTicker(`${courts.length} court${courts.length > 1 ? 's' : ''} found. Working out bike routes…`);
  let routed = true;
  try { courts = await addBikeDistances(courts, signal); } catch { routed = false; }
  if (id !== searchId) return;
  stopTicker();
  render(courts);
  const n = courts.length, s = n > 1 ? 's' : '';
  setStatus(routed
    ? `${n} court${s}. Nearest by bike: ${fmt(courts[0].bike)}, ~${mins(courts[0].bikeTime)}.` + (n > MAX_ROUTED ? ` (Only the ${MAX_ROUTED} closest were routed.)` : '')
    : `${n} court${s}. Bike router unavailable, so these are straight-line distances.`);
}

$('gps').onclick = () => {
  if (!navigator.geolocation) return setStatus('Your browser has no location support. Type an address instead.');
  setStatus('Getting your location…');
  navigator.geolocation.getCurrentPosition(
    p => searchFrom(p.coords.latitude, p.coords.longitude, 'You are here'),
    err => setStatus('Location blocked or unavailable (' + err.message + '). Type an address or tap the map.'),
    { enableHighAccuracy: true, timeout: 15000 }
  );
};

// Geocoding: address → coordinates (OpenStreetMap Nominatim)
async function geocode() {
  const q = $('addr').value.trim();
  if (!q) return;
  setStatus('Looking up address…');
  try {
    const res = await fetchWithTimeout('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const hits = await res.json();
    if (!hits.length) return setStatus('Address not found. Try adding the town name.');
    searchFrom(+hits[0].lat, +hits[0].lon, hits[0].display_name.split(',').slice(0, 2).join(','));
  } catch (e) { setStatus('Address lookup failed (' + e.message + ').'); }
}
$('search').onclick = geocode;
$('addr').addEventListener('keydown', e => { if (e.key === 'Enter') geocode(); });

map.on('click', e => searchFrom(e.latlng.lat, e.latlng.lng, 'Chosen spot'));
$('radius').onchange = () => { if (home) searchFrom(home.lat, home.lon); };

try {
  const saved = JSON.parse(localStorage.getItem('courtHome'));
  if (saved) searchFrom(saved.lat, saved.lon, 'Last spot');
} catch {}
</script>
</body>
</html>
